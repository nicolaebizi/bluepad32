name: Build PlatformIO ESP32

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verified PlatformIO environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19" "scons==4.8.1" "click==8.1.7"

      - name: Build ESP32
        run: |
          pio run -e esp32dev

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bluepad32-gamepad-firmware
          path: firmware/*.bin
          if-no-files-found: error
